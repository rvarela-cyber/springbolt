<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Liberty Lift — Locations (Mobile)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ll-navy: #0D1B2A;
  --ll-blue: #1A3A5C;
  --ll-accent: #C8963E;
  --ll-steel: #4A6FA5;
  --ll-light: #F4F6F9;
  --ll-mid: #D6DDE8;
  --ll-text: #1A2B3C;
  --ll-muted: #6B7E94;
  --ll-white: #FFFFFF;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #1A1A2E;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 32px 0 48px;
}

/* ── PHONE SHELL ── */
.phone-shell {
  width: 390px;
  background: var(--ll-light);
  border-radius: 52px;
  overflow: hidden;
  box-shadow:
    0 0 0 9px #2C2C3E,
    0 0 0 11px #111,
    0 40px 100px rgba(0,0,0,0.7);
  position: relative;
  flex-shrink: 0;
}
.phone-notch {
  height: 44px;
  background: var(--ll-white);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #eee;
}
.phone-notch-pill {
  width: 90px; height: 12px;
  background: #111;
  border-radius: 20px;
}
.phone-content {
  overflow-y: auto;
  max-height: 780px;
  -webkit-overflow-scrolling: touch;
  background: var(--ll-light);
  overflow-x: hidden;
}
.phone-home-bar {
  height: 32px;
  background: var(--ll-white);
  display: flex;
  align-items: center;
  justify-content: center;
  border-top: 1px solid #eee;
}
.phone-home-pill {
  width: 110px; height: 5px;
  background: #222;
  border-radius: 20px;
}

/* ── PAGE CONTENT ── */
.ll-section { padding: 1.25rem 0 1.5rem; }
.section-title { padding: 0 1rem; }
.map-tabs { padding: 0 1rem; }
.below-map { padding: 0 1rem; }
.section-title { font-size: 1.35rem; font-weight: 700; color: var(--ll-navy); text-align: center; margin-bottom: 1.25rem; }

/* ── TABS ── */
.map-tabs { display: flex; gap: 0; justify-content: center; }
.map-tab {
  padding: 9px 18px; font-size: 0.78rem; font-weight: 600;
  cursor: pointer; border: none; background: var(--ll-mid);
  color: var(--ll-muted); border-radius: 10px 10px 0 0;
  letter-spacing: 0.02em;
}
.map-tab.active { background: var(--ll-white); color: var(--ll-navy); box-shadow: 0 -3px 0 0 var(--ll-accent) inset; }

/* ── MAP CARD ── */
.map-card {
  background: var(--ll-white);
  border-radius: 0;
  overflow: hidden;
  box-shadow: none;
}
.map-view { display: none; position: relative; width: 100%; background: var(--ll-white); }
.map-view.active { display: block; }
.map-bg { display: block; width: 100%; height: auto; }

/* ── PINS — visible, not clickable ── */
.pin {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
  cursor: default;
  z-index: 10;
}
.pin-dot {
  width: 10px; height: 10px;
  background: var(--ll-accent);
  border: 2px solid var(--ll-white);
  border-radius: 50%;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}
.pin.office .pin-dot { background: #6B7E94; }
.pin.intl .pin-dot { background: var(--ll-steel); }

/* ── LEGEND ── */
.map-legend {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding: 0;
  border-top: 1px solid var(--ll-light);
  background: var(--ll-white);
}
.legend-row-1 {
  display: flex;
  justify-content: center;
  gap: 1.2rem;
  padding: 0.6rem 1rem 0.5rem;
  width: 100%;
}
.legend-contact {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0.5rem 1rem 0.75rem;
  width: 100%;
  font-size: 15px;
  font-weight: 600;
  color: var(--ll-navy);
  border-top: 1px solid var(--ll-light);
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ll-muted); font-weight: 500; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ll-white); box-shadow: 0 0 0 1px rgba(0,0,0,0.14); }

/* ── ACCORDIONS ── */
.below-map { margin-top: 1.5rem; }
.accordions-header { font-size: 1.1rem; font-weight: 700; color: var(--ll-navy); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--ll-accent); display: inline-block; }
.regions-grid { display: flex; flex-direction: column; gap: 7px; }
.region-card { background: var(--ll-white); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(13,27,42,0.07); border: 1px solid var(--ll-mid); }
.region-card.hidden { display: none; }
.region-header { display: flex; align-items: center; padding: 11px 13px; cursor: pointer; user-select: none; gap: 9px; }
.region-pip { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.region-name { font-size: 12px; font-weight: 600; color: var(--ll-navy); flex: 1; }
.region-count { font-size: 10px; color: var(--ll-muted); font-weight: 500; background: var(--ll-light); padding: 2px 8px; border-radius: 20px; flex-shrink: 0; white-space: nowrap; }
.region-chevron { font-size: 16px; color: var(--ll-muted); transition: transform 0.22s; flex-shrink: 0; line-height: 1; }
.region-chevron.open { transform: rotate(180deg); }
.region-body { display: none; border-top: 1px solid var(--ll-mid); }
.region-body.open { display: block; }
.location-item { padding: 10px 13px; border-bottom: 1px solid var(--ll-light); }
.location-item:last-child { border-bottom: none; }
.loc-name { font-size: 12px; font-weight: 600; color: var(--ll-navy); margin-bottom: 2px; }
.loc-addr { font-size: 10px; color: var(--ll-muted); margin-bottom: 4px; line-height: 1.45; }
.loc-products-label { font-size: 9px; font-weight: 700; color: var(--ll-accent); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 3px; }
.tag { font-size: 9px; padding: 2px 7px; border-radius: 20px; background: #EAF0F8; color: var(--ll-blue); font-weight: 500; }

/* ── CONTACT FORM ── */
.contact-section { background: #fff; padding: 2rem 1rem 1.5rem; }
.contact-title { font-size: 1.6rem; font-weight: 800; color: #111; margin-bottom: 1.5rem; }
.contact-grid { display: flex; flex-direction: column; gap: 1rem; }
.cf-input {
  background: #F6F6F6; border: 1px solid #E8E8E8; border-radius: 6px;
  padding: 14px 16px; font-size: 0.82rem; color: #555;
  font-family: 'Inter', sans-serif; outline: none; width: 100%;
}
.cf-input::placeholder { color: #888; }
.cf-input:focus { border-color: var(--ll-accent); }
.cf-textarea { min-height: 100px; resize: vertical; }
.cf-submit-row { display: flex; justify-content: flex-end; }
.cf-submit {
  background: #D4E200; border: none; border-radius: 6px;
  padding: 12px 24px; font-size: 0.85rem; font-weight: 700;
  font-family: 'Inter', sans-serif; cursor: pointer; color: #111;
}
</style>
</head>

function pct(val, total) { return (val / total * 100).toFixed(4) + '%'; }

function buildPins(regions, containerId, imgW, imgH, tab) {
  const container = document.getElementById(containerId);
  regions.forEach((r, i) => {
    const pin = document.createElement('div');
    pin.className = 'pin' + (r.type === 'intl' ? ' intl' : r.type === 'office' ? ' office' : '');
    pin.style.left = pct(r.px, imgW);
    pin.style.top = pct(r.py, imgH);
    pin.innerHTML = '<div class="pin-dot"></div>';
    container.appendChild(pin);
  });
}

function switchTab(tab) {
  document.getElementById('tabUS').classList.toggle('active', tab === 'us');
  document.getElementById('tabIntl').classList.toggle('active', tab === 'intl');
  document.getElementById('viewUS').classList.toggle('active', tab === 'us');
  document.getElementById('viewIntl').classList.toggle('active', tab === 'intl');
  document.querySelectorAll('.region-card').forEach(c => {
    const isIntl = c.dataset.intl === '1';
    c.classList.toggle('hidden', isIntl ? tab !== 'intl' : tab !== 'us');
  });
}

function buildAccordions() {
  const grid = document.getElementById('regionsGrid');
  const all = [
    ...US_REGIONS.map(r => ({...r, intl: false})),
    ...INTL_REGIONS.map(r => ({...r, intl: true}))
  ];
  all.sort((a, b) => a.name.localeCompare(b.name));
  all.forEach(r => {
    const card = document.createElement('div');
    card.className = 'region-card';
    card.dataset.intl = r.intl ? '1' : '0';
    if (r.intl) card.classList.add('hidden');
    const header = document.createElement('div');
    header.className = 'region-header';
    header.innerHTML = `
      <div class="region-pip" style="background:${r.color}"></div>
      <span class="region-name">${r.name}</span>
      <span class="region-count">${r.locations.length} Location${r.locations.length !== 1 ? 's' : ''}</span>
      <span class="region-chevron">&#8964;</span>
    `;
    const body = document.createElement('div');
    body.className = 'region-body';
    body.innerHTML = r.locations.map(l => `
      <div class="location-item">
        <div class="loc-name">${l.name}</div>
        <div class="loc-addr">${l.addr}</div>
        ${l.products.length ? `<div class="loc-products-label">Product Lines</div><div class="tags">${l.products.map(p => `<span class="tag">${p}</span>`).join('')}</div>` : ''}
      </div>
    `).join('');
    header.addEventListener('click', () => {
      body.classList.toggle('open');
      header.querySelector('.region-chevron').classList.toggle('open');
    });
    card.appendChild(header);
    card.appendChild(body);
    grid.appendChild(card);
  });
}
